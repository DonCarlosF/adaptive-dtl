name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Test
        run: npm test

      - name: Build
        run: npm run build

  server:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: server
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: server/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Test
        run: npm test

  e2e:
    runs-on: ubuntu-latest
    env:
      # Sandboxed dev environments preinstall browsers and set
      # PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD / PLAYWRIGHT_BROWSERS_PATH; CI must
      # actually download Chromium into the default cache. "0"/"" read as
      # unset by Playwright, so this is a no-op on GitHub-hosted runners and
      # an explicit override on self-hosted ones.
      PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: "0"
      PLAYWRIGHT_BROWSERS_PATH: ""
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: |
            package-lock.json
            server/package-lock.json

      - name: Install dependencies
        run: npm ci

      # The cloud-mode spec runs the real backend (spawned by Playwright's
      # webServer config), so the server workspace needs its deps too.
      - name: Install server dependencies
        run: npm ci
        working-directory: server

      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium

      - name: Build app (local + cloud bundles)
        run: npm run e2e:build

      - name: Run E2E suite
        run: npx playwright test

      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7
